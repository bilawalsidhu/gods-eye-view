<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroidEye</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#05080a; color:#7CFFB2;
         font: 15px/1.5 ui-monospace, Menlo, monospace; text-align:center; padding:16px; box-sizing:border-box; }
  h1 { letter-spacing:.3em; font-size:22px; margin:0 0 12px; }
  p { color:#9fb3a8; max-width:340px; margin:0 auto 16px; }
  button { background:none; border:1px solid #7CFFB2; color:#7CFFB2; padding:10px 18px; font:inherit; border-radius:4px; }
</style>
</head>
<body>
  <div>
    <h1>DROIDEYE</h1>
    <p>Can't reach the DroidEye server. Check your internet connection. A free server can take up to a minute to wake up.</p>
    <button onclick="location.reload()">RETRY</button>
  </div>
</body>
</html>
