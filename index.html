<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>God's Eye View</title>
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="God's Eye" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,layers,layers_clear,light_mode,local_fire_department,more_horiz,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,search,settings,skip_next,skip_previous,upload_file,videocam,view_in_ar,visibility,visibility_off" rel="stylesheet" />
</head>
<body>
  <!-- gev:template scene-chrome -->

  <!-- gev:template cockpit -->

  <!-- gev:template display-controls -->

  <!-- gev:template command-dock -->

  <!-- gev:template layer-panels -->

  <!-- gev:template context -->

  <!-- gev:template welcome -->

  <!-- gev:template provider-settings -->

  <!-- gev:template hud-loading -->

  <!-- Habblaud integration: optional local companion; no credentials or geodata are sent by this link. -->
  <aside id="habblaud-geo-launcher" aria-label="Integração Habblaud" style="position:fixed;left:185px;bottom:14px;z-index:9999;background:#102a37ee;border:1px solid #52c9a7;border-radius:12px;padding:8px 11px;font:12px system-ui;color:#e9ffff;box-shadow:0 8px 24px #0008;max-width:230px;touch-action:none">
    <div id="habblaud-drag" style="cursor:grab;user-select:none;touch-action:none;display:flex;justify-content:space-between;gap:8px"><strong>⠿ 🤖 Habblaud</strong><button id="habblaud-collapse" type="button" aria-label="Recolher painel" style="background:#275369;border:0;color:white;cursor:pointer">−</button></div><div id="habblaud-body">
    <div style="font-size:11px;opacity:.85">Agentes e relatórios (serviço local opcional)</div>
    <a href="http://127.0.0.1:4747/geo-mission" target="_blank" rel="noopener noreferrer" style="color:#83f2d0">Abrir central de agentes e cadastrar presets</a>
    <div><a href="/roadmap.html" target="_blank" rel="noopener noreferrer" style="color:#83f2d0">🌍 Roadmap Geo Mission BR — 10 módulos</a></div><details style="margin-top:4px"><summary style="cursor:pointer">Outra porta do Habblaud?</summary><label style="display:block">Porta local <input id="habblaud-geo-port" type="number" min="1" max="65535" value="4747" style="width:80px;background:#091a25;color:white;border:1px solid #658a92"></label><button type="button" id="habblaud-geo-open" style="cursor:pointer;background:#3bb99b;border:0;padding:5px 8px;border-radius:4px">Abrir</button></details></div>
  </aside>
  <script>
    const box=document.getElementById('habblaud-geo-launcher'),handle=document.getElementById('habblaud-drag'),body=document.getElementById('habblaud-body');
    document.getElementById('habblaud-collapse').addEventListener('click',function(){body.hidden=!body.hidden;this.textContent=body.hidden?'+':'−';});
    let drag=null;
    handle.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;const r=box.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};handle.setPointerCapture(e.pointerId);});
    handle.addEventListener('pointermove',function(e){if(!drag)return;box.style.left=Math.max(0,Math.min(innerWidth-box.offsetWidth,drag.left+e.clientX-drag.x))+'px';box.style.top=Math.max(0,Math.min(innerHeight-box.offsetHeight,drag.top+e.clientY-drag.y))+'px';box.style.right='auto';box.style.bottom='auto';});
    handle.addEventListener('pointerup',function(){drag=null;try{localStorage.setItem('habblaud-geo-position',JSON.stringify({left:box.style.left,top:box.style.top}))}catch{}});
    try{const saved=JSON.parse(localStorage.getItem('habblaud-geo-position')||'null');if(saved&&/^\d+px$/.test(saved.left)&&/^\d+px$/.test(saved.top)){box.style.left=saved.left;box.style.top=saved.top;box.style.bottom='auto';}}catch{}
    document.getElementById('habblaud-geo-open').addEventListener('click',function(){
      const port=Number(document.getElementById('habblaud-geo-port').value);
      if(!Number.isInteger(port)||port<1||port>65535)return;
      window.open('http://127.0.0.1:'+port+'/geo-mission','_blank','noopener,noreferrer');
    });
  </script>
  <style>
    body.ui-embed.geo-controls #left-panel-stack,
    body.ui-embed.geo-controls #command-dock,
    body.ui-embed.geo-controls #right-context-rail,
    body.ui-embed.geo-controls #corner-actions,
    body.ui-embed.geo-controls #view-switcher {display: revert !important;}
    body.ui-embed.geo-controls #habblaud-geo-launcher {display:none !important;}
  </style>
  <script>
    if(new URLSearchParams(location.search).get('geoControls')==='1')document.documentElement.classList.add('geo-controls');
    document.addEventListener('DOMContentLoaded',()=>{if(new URLSearchParams(location.search).get('geoControls')==='1')document.body.classList.add('geo-controls')});
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
