# MiniCPM5-1B — official 4-bit MLX weights for lower-memory Apple Silicon Macs.
name: minicpm5-1b-mlx
backend: mlx
context_size: 16384
known_usecases: [chat, completion]
parameters:
  model: openbmb/MiniCPM5-1B-MLX
  temperature: 0.1
  top_p: 0.95
options:
  - use_jinja:true
template:
  use_tokenizer_template: true
