# Deploy to Cloudflare Pages.
#
# Quality gates (lint / test / coverage / build) live in ci.yml — this
# workflow only builds the release artifact again (fresh env) and ships it.
# A deploy therefore never happens without ci.yml having run on the same
# commit (branch protection can enforce this; see docs/RUNBOOK.md).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Expose env vars for the build.
          # VITE_-prefixed vars are exposed to the browser via vite.config.js define.
          # Non-VITE_ secrets (API keys for the Vite proxy) are not needed at build time —
          # they are injected at runtime by the Pages Functions from the dashboard / _vars.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_CESIUM_ION_TOKEN: ${{ vars.VITE_CESIUM_ION_TOKEN }}

      - name: Deploy to Cloudflare Pages (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # NOT SHA-pinned (unlike the actions above): the cloudflare/pages-action
        # repository now 404s upstream, so no fresh SHA can be verified. The
        # floating tag still resolves via GitHub's cached copy; migrating this
        # deploy to wrangler-action is an owner decision, not an audit edit.
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gods-eye-view
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          # Route *.pages.dev for preview deployments
          # Production routes are handled via Cloudflare Zone DNS

      - name: Deploy preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gods-eye-view
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          # Auto-assigned preview URL via CF_PAGES_URL output
