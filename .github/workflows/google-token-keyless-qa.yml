name: Google Token Keyless QA

on:
  pull_request:
    branches:
      - fix/keyless-google-token-404

permissions:
  contents: read

jobs:
  keyless-runtime:
    name: Google token dev/preview + browser + tracking
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      GOOGLE_MAPS_API_KEY: ''
      CESIUM_ION_TOKEN: ''
      MAPILLARY_CLIENT_TOKEN: ''
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies and pinned headless Chrome
        run: npm ci

      - name: Google token fallback unit tests
        run: node --test server/standalone/google-token-unavailable.test.mjs src/maps/googleTokens.test.mjs

      - name: Start keyless development server and assert token status
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > dev-google-qa.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat dev-google-qa.log; exit 1; fi
          status=$(curl --silent --show-error --output /tmp/token-body --write-out '%{http_code}' http://127.0.0.1:4173/api/google/tiles-token)
          echo "Development token response: HTTP $status"
          test "$status" = "204"
          test ! -s /tmp/token-body
          curl --silent --show-error --head http://127.0.0.1:4173/api/google/tiles-token | grep -Eqi '^HTTP/[^ ]+ 204'

      - name: Browser startup and token-only console-error check
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer';
          const browser = await puppeteer.launch({
            headless: true,
            args: ['--no-sandbox', '--use-gl=angle', '--use-angle=swiftshader'],
          });
          try {
            const page = await browser.newPage();
            const tokenErrors = [];
            const tokenPath = '/api/google/tiles-token';
            page.on('console', (message) => {
              if (message.type() !== 'error') return;
              if ((message.text() + ' ' + (message.location()?.url || '')).includes(tokenPath))
                tokenErrors.push(message.text());
            });
            page.on('response', (response) => {
              const url = new URL(response.url());
              if (url.origin === 'http://127.0.0.1:4173' && url.pathname === tokenPath
                && response.status() !== 204)
                tokenErrors.push('Token request returned HTTP ' + response.status());
            });
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForFunction(() => Boolean(window.__godsEyeView?.viewer), {
              timeout: 120000,
            });
            await new Promise((resolve) => setTimeout(resolve, 2000));
            const token = await page.evaluate(async () => {
              const response = await fetch('/api/google/tiles-token', { cache: 'no-store' });
              return { status: response.status, body: await response.text() };
            });
            if (token.status !== 204 || token.body || tokenErrors.length) {
              throw new Error(JSON.stringify({ token, tokenErrors }));
            }
            console.log('PASS: keyless browser started and token path returned 204 without token-related console errors');
          } finally {
            await browser.close();
          }
          JS

      - name: Tracking regression browser gate
        run: npm run test:track -- --offline-imagery

      - name: Build app and verify preview token response
        shell: bash
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > preview-google-qa.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat preview-google-qa.log; exit 1; fi
          status=$(curl --silent --show-error --output /tmp/token-preview-body --write-out '%{http_code}' http://127.0.0.1:4174/api/google/tiles-token)
          echo "Preview token response: HTTP $status"
          test "$status" = "204"
          test ! -s /tmp/token-preview-body

      - name: Collect diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-token-runtime-evidence
          path: |
            dev-google-qa.log
            preview-google-qa.log
            qa-shots/
          if-no-files-found: ignore
          retention-days: 7

  keyless-browser-gates:
    name: Keyless attribution, Cockpit, Contacts QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      GOOGLE_MAPS_API_KEY: ''
      CESIUM_ION_TOKEN: ''
      MAPILLARY_CLIENT_TOKEN: ''
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies and pinned headless Chrome
        run: npm ci

      - name: Start keyless development server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > dev-browser-qa.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat dev-browser-qa.log; exit 1; fi

      - name: Attribution QA gate
        run: node scripts/qa-attribution-b12.mjs --url http://127.0.0.1:4173

      - name: Cockpit utility QA gate
        run: node scripts/qa-cockpit-utility.mjs

      - name: Contacts keyless QA gate
        run: node scripts/qa-context-arrivals.mjs http://127.0.0.1:4173 --only contacts --out qa-shots/context-arrivals

      - name: Collect diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-token-browser-evidence
          path: |
            dev-browser-qa.log
            qa-shots/
          if-no-files-found: ignore
          retention-days: 7
