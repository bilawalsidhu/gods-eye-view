name: Temporary branch formatter

on:
  push:
    branches:
      - perf/imagery-stale-thumbnail-cancellation-20260929

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/imagery-stale-thumbnail-cancellation-20260929
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply adopted formatting"
          git push origin HEAD:perf/imagery-stale-thumbnail-cancellation-20260929
