name: CONAE final browser check
on:
  push:
    branches: [contrib/argentina-conae-goes]
permissions:
  contents: read
jobs:
  fires:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format
      - name: Report formatting changes
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const paths = execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for (const path of paths) console.log('FORMATTED ' + JSON.stringify({path,content:readFileSync(path,'utf8')}));
          JS
      - name: Check formatting and boundaries
        run: |
          npm run format:check
          npm run check:boundaries
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/gev-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gev-dev.log
          exit 1
      - name: Fires fixtures
        run: node scripts/qa-firms.mjs --url http://127.0.0.1:4173 --fixtures
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conae-fires-browser
          path: qa-shots/
          if-no-files-found: ignore
