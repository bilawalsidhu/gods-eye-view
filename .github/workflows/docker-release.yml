name: Docker release

# Publishes a multi-arch (linux/amd64 + linux/arm64) image to GHCR when a
# GitHub release is published. Each architecture is built on a native runner,
# so there is no QEMU emulation and every platform gets its own esbuild/sharp
# binaries from `npm ci`. The per-platform digests are then stitched into one
# multi-arch manifest. Pattern: Docker's "distribute build across multiple
# runners" guide.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build, for example v1.2.3'
        required: true
        type: string
      latest:
        description: 'Also move the `latest` tag to this build'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Never cancel a release publish half way through.
  group: docker-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # No tags here: the merge job tags the combined manifest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      version: ${{ steps.ref.outputs.version }}
      digest: ${{ steps.ref.outputs.digest }}
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotate the multi-arch index itself, which is what registries show.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=sha
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
          annotations: |
            org.opencontainers.image.title=God's Eye View
            org.opencontainers.image.description=Real-time 3D globe of live aircraft, ships, satellites, weather and more, served by the app's Vite dev server.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$META_JSON")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$META_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect image
        id: ref
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

  release-notes:
    name: Add image details to release notes
    if: github.event_name == 'release'
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.merge.outputs.image }}
      VERSION: ${{ needs.merge.outputs.version }}
      DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - name: Append container image section
        run: |
          start='<!-- gev-container-image:start -->'
          end='<!-- gev-container-image:end -->'
          readme="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#prebuilt-image"

          # Drop a section from an earlier run, so a re-run refreshes it
          # instead of appending a second copy.
          gh release view "$RELEASE_TAG" --json body --jq .body \
            | awk -v s="$start" -v e="$end" '
                index($0, s) { skip = 1 }
                !skip { print }
                index($0, e) { skip = 0 }
              ' > body.md

          {
            echo
            echo "$start"
            echo "## Container image"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "- Version tag: \`${VERSION}\` (also \`${IMAGE}:latest\` for stable releases)"
            echo "- Platforms: \`linux/amd64\` and \`linux/arm64\` (including Apple Silicon, Raspberry Pi 4/5 and AWS Graviton)"
            echo "- Manifest digest: \`${DIGEST}\`"
            echo "- Run it: see the [Docker section of the README](${readme})"
            echo "$end"
          } >> body.md

          gh release edit "$RELEASE_TAG" --notes-file body.md
