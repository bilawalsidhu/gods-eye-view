name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate workflow YAML
        run: node -e "require('js-yaml').load(require('node:fs').readFileSync('.github/workflows/ci.yml','utf8'))"