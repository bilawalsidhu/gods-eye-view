name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        run: npm run layer-token:check -- --base-ref origin/main

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  street-level-browser:
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies and headless Chrome
        run: npm ci

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: npm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: npm run qa:street-level:fixtures -- --strict --url http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs src/codexOauthRealtime.test.mjs

      - name: Build production bundle
        run: npm run build

  docker:
    # Builds the image on a native runner per architecture (no QEMU), then
    # starts it standalone and checks it the way a user would. Nothing is
    # pushed and no registry login happens; publishing is docker-release.yml.
    name: Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            esbuild: linux-x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            esbuild: linux-arm64
    env:
      IMAGE: gev-ci:${{ matrix.esbuild }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Record build start
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=ci-docker-${{ matrix.esbuild }}
          cache-to: type=gha,mode=max,scope=ci-docker-${{ matrix.esbuild }}

      - name: Start the image and wait until it is healthy
        run: |
          echo "BUILD_SECONDS=$(( $(date +%s) - BUILD_START ))" >> "$GITHUB_ENV"
          docker run -d --name gev -p 127.0.0.1:4173:4173 "$IMAGE"
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' gev)"
            running="$(docker inspect --format '{{.State.Running}}' gev)"
            if [ "$running" != 'true' ]; then
              echo "Container exited before becoming healthy"
              break
            fi
            if [ "$health" = 'healthy' ] && curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo "Healthy after about $(( attempt * 2 ))s"
              echo "HEALTH=healthy" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "HEALTH=${health:-unknown}" >> "$GITHUB_ENV"
          echo "Not healthy (status: ${health:-unknown})"
          exit 1

      - name: Check the native binaries match the platform
        run: |
          found="$(docker run --rm --entrypoint sh "$IMAGE" -c 'ls node_modules/@esbuild')"
          echo "node_modules/@esbuild: $found"
          echo "ESBUILD_DIRS=$found" >> "$GITHUB_ENV"
          test "$found" = '${{ matrix.esbuild }}'

      - name: Container log
        if: failure()
        run: docker logs gev || true

      - name: Summarise
        if: always()
        run: |
          size="$(docker image inspect "$IMAGE" --format '{{.Size}}' 2>/dev/null | awk '{ printf "%.0f MB", $1 / 1000000 }')"
          {
            echo '### Docker image'
            echo
            echo '| Platform | Image size | Health | esbuild | Build time |'
            echo '| --- | --- | --- | --- | --- |'
            echo "| ${{ matrix.platform }} | ${size:-n/a} | ${HEALTH:-not run} | ${ESBUILD_DIRS:-n/a} | ${BUILD_SECONDS:-n/a}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove container
        if: always()
        run: docker rm -f gev || true
