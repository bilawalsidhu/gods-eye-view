# CI for God's Eye View.
#
# Gates mirror the local battery exactly:
#   - strict lint (eslint --max-warnings 0) — the policy lives in
#     eslint.config.js; zero warnings tolerated, narrow justified inline
#     disables only;
#   - unit suite (scripts/run-unit-tests.mjs) under Node 24 — the runtime the
#     allocation microbenchmarks were calibrated on, with
#     GEV_REQUIRE_ALLOCATION_GATE=1 so an uncalibrated runtime FAILS here
#     instead of silently skipping the budgets;
#   - a coverage job publishing the measured number (no threshold gate yet —
#     see Phase 3 of docs/PLAN.md);
#   - production build (vite build) — the artifact a Pages deploy ships —
#     followed by the bundle-budgets gate so dist growth is a reviewed
#     decision (docs/PLAN.md Phase 7, issue #40).
#
# Deployment stays manual (`npx wrangler pages deploy dist --project-name
# globe --branch main`, see docs/RUNBOOK.md) — this workflow does not
# deploy, so a green CI never implies a shipped site.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Strict lint (zero warnings)
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit suite (allocation budgets enforced)
        run: npm test
        env:
          GEV_REQUIRE_ALLOCATION_GATE: '1'

  # Publishes the measured coverage number on every push (Node's built-in
  # reporter over the parallel battery). Measurement only — no threshold gate
  # until the Phase 3 targets in docs/PLAN.md are chosen from this data.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Coverage report
        run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The FIRMS WASM heat renderer lives in public/wasm/ (gitignored build
      # artifact) and is loaded at runtime by src/data/firmsHeatTexture.js —
      # rebuild it before vite copies public/ into dist so the shipped bundle
      # keeps the WASM path (the app falls back to entity cells without it).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install
        run: npm ci
      - name: Build FIRMS WASM renderer
        run: npm run build:wasm
      - name: Production build
        run: npm run build
      # Bundle budgets (docs/PLAN.md Phase 7, issue #40): dist growth is a
      # reviewed decision — the gate also verifies the built sw.js precache
      # manifest still lists the shell, so workbox's per-file cap can never
      # silently drop the offline shell.
      - name: Bundle budgets
        run: npm run check:budgets
      - name: Archive dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
