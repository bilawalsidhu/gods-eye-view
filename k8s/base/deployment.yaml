# Kubernetes equivalent of compose.yaml's service, for the Kustomize base.
#
# Differences from compose.yaml, and why:
# - No bind mount of the checkout. The code is baked into the image; the pod
#   has no host filesystem. Keys pasted into the setup UI write to .env inside
#   the container and are lost on pod restart. Use a Secret for provider keys.
# - Runs as uid 1000 (the image's `node` user), matching the Dockerfile.
# - One replica with Recreate: local state lives on the container filesystem,
#   so two pods must never write it at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-eye-view
  labels:
    app.kubernetes.io/name: gods-eye-view
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gods-eye-view
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gods-eye-view
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gods-eye-view
          # Placeholder: each overlay sets its own registry path and tag
          # (images: newName, newTag).
          image: ghcr.io/bilawalsidhu/gods-eye-view
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4173"
            # Same knobs as compose.yaml. Set GEV_ALLOWED_HOSTS to the public
            # hostname so the Host allowlist accepts requests through Istio.
            - name: GEV_ALLOWED_HOSTS
              value: ""
            - name: GEV_KEY_SETUP_TRUSTED_PEERS
              value: ""
          # Provider keys (OPENAI_API_KEY, ...) come from a Secret created
          # outside git, so kustomize never owns or resets its values. It is
          # optional: the pod starts without it, and the keys are simply absent.
          envFrom:
            - secretRef:
                name: gev-provider-keys
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Same check as the Dockerfile HEALTHCHECK. The startup probe covers
          # Vite's first-run dependency optimisation (up to ~3 minutes).
          # No `host:` here: in httpGet it is the address kubelet dials, and
          # 127.0.0.1 is refused. Leaving it unset probes the pod IP, which the
          # app listens on.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "4Gi"
          volumeMounts:
            # Scratch space for Vite's dep-optimizer cache and /tmp. Ephemeral
            # by design: rebuilt on start, never needs to persist.
            - name: tmp
              mountPath: /tmp
            - name: vite-cache
              mountPath: /app/node_modules/.vite
      volumes:
        - name: tmp
          emptyDir: {}
        - name: vite-cache
          emptyDir: {}
