# Fly.io config for the hosted profile. Set secrets with `fly secrets set`.
app = "gods-eye-view"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  GEV_TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived AIS and alert streams need the machine to stay up.
  auto_stop_machines = "off"
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
