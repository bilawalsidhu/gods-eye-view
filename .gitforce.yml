# GitForge local CI pipeline (self-hosted GitForge at /nas/Temp/repos/GitForge).
#
# Mirrors .github/workflows/ci.yml — same gates, same order of importance:
# strict lint + prod-deps audit, the unit suite under BOTH calibrated Node
# majors with the allocation budgets enforced, the coverage report, and the
# production build + bundle budgets (build:wasm → vite build → check:budgets).
# Deployment stays manual (docs/RUNBOOK.md) in BOTH systems: a green run
# never implies a shipped site.
#
# Documented differences from the GitHub workflow (same list of constraints
# proven in dsc's .gitforce.yml):
# - The matrix is two explicit jobs (test-node24 / test-node26) instead of a
#   `strategy.matrix` — the GitForge pipeline schema has no matrix. Both run
#   on the one gev-ci-node:1 image; the node-26 job prepends
#   /opt/node26/bin to PATH inside the step, because job-level `env:` is
#   parsed but never forwarded to the job containers (the runner builds its
#   ExecutableJob with an empty env map) — a job-level PATH override is
#   therefore impossible and every variable a step needs is either baked
#   into the image or set inline on the command.
# - GEV_REQUIRE_ALLOCATION_GATE=1 rides inline on the `npm test` command for
#   the same reason (env: is dead); the GitHub workflow sets it via `env:`.
# - `environment: {}` is required by the parser (PipelineDefinition has no
#   serde default) even though it is never forwarded — same as dsc.
# - The dist artifact upload is absent (no artifact service here); the
#   production artifact a Pages deploy ships is built locally per the
#   RUNBOOK pre-release checklist instead.
# - Images are pre-built on the host from infrastructure/docker/ and must
#   exist before the first run: the NAS daemon's vfs storage driver plus the
#   runner's hard 60-second sandbox-acquisition cap make a pull-at-run-time
#   a guaranteed failure. Rebuild gev-ci-node:1 when package-lock.json
#   changes and gev-ci-rust:1 when rust/firms-renderer/Cargo.lock changes
#   (instructions in the Dockerfile headers).
# - The job graph is a LINEAR CHAIN with ONE safe parallel pair
#   (lint → {security, test-node24} → test-node26 → coverage → build),
#   not the GitHub workflow's fan-out, because all jobs of one run share
#   the SAME workspace directory on this runner (GitHub gives each job a
#   fresh VM). Jobs with `needs: [lint]` alone dispatch concurrently and
#   their `npm ci` steps delete each other's node_modules mid-flight —
#   measured 2026-09-15 as `Cannot find package 'mersenne-twister'` from
#   @cesium/engine with 410/580 packages on disk. dsc's fan-out
#   .gitforce.yml hits the same wall (all runs red). The one parallel pair
#   is safe precisely because the security job runs NO npm — it only reads
#   tracked files (baseline + checkout) while test-node24's `npm ci`
#   churns node_modules, which aegis's gitignore-aware scan never enters.
#   The cost of everything else is wall-time serialization; the npm cache
#   keeps each `npm ci` ~12 s, so the chain is acceptable.
#
# - The security job runs ONLY here, not in the GitHub workflow: the aegis
#   binary is built from the local aegis checkout into the gev-ci-node:1
#   image (bookworm, per the Dockerfile header) and is not installable on
#   GitHub-hosted runners. Semantics follow dsc's proven gate: a scan for
#   secrets-category, high-severity findings minus the committed
#   .aegis-baseline.json fingerprints — the 68 accepted findings (triaged
#   2026-09-15: doc-example keys, test localhost mocks, vendored cesium)
#   pass; anything NEW fails the job. Canary-verified 2026-09-20: the
#   baselined tree exits 0 and a planted random-shaped AWS key exits 1
#   (the canonical AWS docs example key id is allowlisted by the
#   scanner and is NOT a valid canary — spell it out nowhere, the L9
#   A5 credential scan greps prefixes without the allowlist).
#   Regenerate the baseline only when
#   an accepted finding legitimately changes position:
#
#     aegis -f json scan --categories secrets --severity-threshold high . \
#       | python3 -c 'import json,sys; d=json.load(sys.stdin);
#         d["stats"]["inspection_ledger"]["units"]=[]; json.dump(d,open(".aegis-baseline.json","w"))'
#
#   (the raw scan's per-inspection ledger is ~6.8MB here; the slimmed file
#   is ~40KB and matches identically under --baseline).
name: gods-eye-view-ci
version: "1.0"
trigger_on:
  - push
environment: {}
jobs:
  - name: lint
    image: gev-ci-node:1
    steps:
      - name: Install
        run: npm ci
      - name: Strict lint (zero warnings)
        run: npm run lint
      - name: Audit production dependencies
        run: npm run check:audit
    # 15m covered eight quiet-box runs (~3 min each) but lost to the same
    # 2026-10-01 load storm that benched the runner and locked the DB: npm ci
    # alone froze mid-install for 50+ min with the container past budget
    # (run 865a3c4f's lint). 30m matches the test budgets — contention should
    # cost queue time, not the first stage of every chain.
    timeout: 30m

  # No `npm ci` — the pattern scan reads the checkout as-is and needs only
  # the binary baked into the image. Version rides the step so a stale image
  # is visible in the log, not silent.
  #
  # The 10m budget held for eight runs on a quiet box (the scan itself takes
  # well under a minute) but timed out 2026-10-01 under host load ~100
  # (docker exec + scan starved; run e7b72bad, job 5636c943, exit -1,
  # `execution error: timeout`). 30m matches the other compute jobs so
  # contention costs queue time, not a red gate with no finding behind it.
  - name: security
    image: gev-ci-node:1
    needs: [lint]
    steps:
      - name: Aegis pattern scan (new secrets findings only)
        run: aegis --version && aegis scan --categories secrets --severity-threshold high --baseline .aegis-baseline.json .
    timeout: 30m

  - name: test-node24
    image: gev-ci-node:1
    needs: [lint]
    steps:
      - name: Install
        run: npm ci
      - name: Unit suite on Node 24 (allocation budgets enforced)
        run: GEV_REQUIRE_ALLOCATION_GATE=1 npm test
    timeout: 30m

  - name: test-node26
    image: gev-ci-node:1
    needs: [test-node24]
    steps:
      - name: Install
        run: npm ci
      - name: Unit suite on Node 26 (allocation budgets enforced)
        run: export PATH=/opt/node26/bin:$PATH && node --version && GEV_REQUIRE_ALLOCATION_GATE=1 npm test
    timeout: 30m

  # Publishes the measured coverage number on every push (no threshold gate
  # — the Phase 3 stance in docs/PLAN.md: the number follows the tests).
  - name: coverage
    image: gev-ci-node:1
    needs: [test-node26]
    steps:
      - name: Install
        run: npm ci
      - name: Coverage report
        run: npm run test:coverage
    timeout: 30m

  # The FIRMS WASM renderer is regenerated before vite copies public/ into
  # dist so the shipped bundle keeps the WASM path (the app falls back to
  # entity cells without it). check:budgets afterwards also verifies the
  # built sw.js precache manifest still lists the offline shell.
  - name: build
    image: gev-ci-rust:1
    needs: [coverage]
    steps:
      - name: Install
        run: npm ci
      - name: Build FIRMS WASM renderer
        run: npm run build:wasm
      - name: Production build
        run: npm run build
      - name: Bundle budgets
        run: npm run check:budgets
    timeout: 40m
