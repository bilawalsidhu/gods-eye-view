[package]
name = "firms-renderer"
version = "0.1.0"
description = "WASM renderer for FIRMS 100k heatmap — Gaussian splatting on OffscreenCanvas"
edition = "2021"
authors = ["Michael Kinney"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "ImageData",
  "OffscreenCanvas",
  "CanvasRenderingContext2d",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
