  <!-- Post-processing toggles (top-right) -->
  <div id="pp-toggles" class="panel-collapsible collapsed" data-panel-id="pp-toggles">
    <div class="compact pp-header-row">
      <span class="pp-header-label">DISPLAY</span>
      <span class="panel-divider" aria-hidden="true"></span>
      <button class="panel-collapse-btn pp-collapse-btn" data-collapse-target="pp-toggles" title="Collapse panel">&#x25C0;</button>
    </div>
    <div class="pp-panel-body" data-rail-scroller>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="hud-toggle" title="Intelligence HUD (H)">
        <span class="pp-icon">&#x25CE;</span>
        <span class="pp-label">HUD</span>
      </button>
      <div class="pp-slider-row" id="hud-layout-row">
        <span class="pp-slider-mini-label">Layout</span>
        <select id="hud-layout-select" class="pp-select" aria-label="HUD layout">
          <option value="tactical">Tactical</option>
          <option value="operator">Operator</option>
          <option value="minimal">Minimal</option>
          <option value="cyber">Cyber</option>
        </select>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-toggle-row" id="cyber-sonar-row">
        <span class="pp-slider-mini-label">Sonar</span>
        <button class="pp-mode-btn active" id="cyber-sonar-toggle" title="Cyber sonar contact scanner" aria-label="Cyber sonar contact scanner" aria-pressed="true">ON</button>
      </div>
      <output id="cyber-sonar-status" class="cyber-sonar-control" role="status"></output>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-rings-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-rings">Rings</label>
        <input type="range" class="pp-slider" id="cyber-sonar-rings" min="3" max="12" step="1" value="8" aria-label="Sonar ring count" />
        <span class="pp-slider-value" id="cyber-sonar-rings-value">8</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-range-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-range">Range</label>
        <input type="range" class="pp-slider" id="cyber-sonar-range" min="60" max="120" step="1" value="100" aria-label="Sonar ring range" />
        <span class="pp-slider-value" id="cyber-sonar-range-value">100%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-intensity-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-intensity">Power</label>
        <input type="range" class="pp-slider" id="cyber-sonar-intensity" min="0" max="100" step="1" value="70" aria-label="Sonar intensity" />
        <span class="pp-slider-value" id="cyber-sonar-intensity-value">70%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-opacity-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-opacity">Opacity</label>
        <input type="range" class="pp-slider" id="cyber-sonar-opacity" min="35" max="100" step="1" value="84" aria-label="Cyber contact and label opacity" title="Minimum opacity for map dots, icons, models, brackets, and labels between sonar passes" />
        <span class="pp-slider-value" id="cyber-sonar-opacity-value">84%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-sector-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-sector">Sector</label>
        <input type="range" class="pp-slider" id="cyber-sonar-sector" min="8" max="60" step="1" value="24" aria-label="Sonar sector width" />
        <span class="pp-slider-value" id="cyber-sonar-sector-value">24°</span>
      </div>
    </div>
    <div class="pp-toggle-group" id="hud-appearance-group">
      <div class="pp-slider-row visible hud-appearance-heading">
        <span class="pp-slider-mini-label" id="hud-appearance-label">HUD</span>
      </div>
      <div class="pp-slider-row visible" id="hud-target-row">
        <span class="pp-slider-mini-label" id="hud-target-label">Target</span>
        <div class="pp-mode-seg" id="hud-target-seg" role="radiogroup" aria-labelledby="hud-target-label">
          <button class="pp-mode-btn active" data-hud-target="default" role="radio" aria-checked="true" title="Each layer's own selection styling">Default</button>
          <button class="pp-mode-btn" data-hud-target="lock" role="radio" aria-checked="false" title="Animated targeting lock on the selected element">Lock</button>
        </div>
      </div>
      <div class="pp-slider-row visible" id="hud-lock-sound-row">
        <label class="pp-slider-mini-label" for="hud-lock-sound-select">Target sound</label>
        <select id="hud-lock-sound-select" class="pp-select" aria-label="Sound played when the Lock target acquires a subject">
          <option value="none">None</option>
          <option value="hud-lock" selected>HUD lock</option>
          <option value="sci-fi-click">Sci-fi click</option>
        </select>
      </div>
      <div class="pp-slider-row visible" id="hud-primary-row">
        <label class="pp-slider-mini-label" for="hud-primary-color">Primary</label>
        <input type="color" class="pp-color-input" id="hud-primary-color" value="#00d4ff" aria-label="HUD primary colour" />
      </div>
      <div class="pp-slider-row visible" id="hud-secondary-row">
        <label class="pp-slider-mini-label" for="hud-secondary-color">Secondary</label>
        <input type="color" class="pp-color-input" id="hud-secondary-color" value="#ffd38a" aria-label="HUD secondary colour" />
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="detection-toggle" title="Detection Overlay (D)" aria-label="Detection overlay" aria-pressed="false">
        <span class="pp-icon">&#x25A3;</span>
        <span class="pp-label">DETECT</span>
      </button>
      <div class="pp-slider-row detection-slider-row" id="detection-slider-row">
        <label class="pp-slider-mini-label" for="detection-density-slider">Density</label>
        <input type="range" class="pp-slider" id="detection-density-slider" min="0" max="100" step="25" value="50" aria-label="Detection label density" />
        <span class="pp-slider-value" id="detection-density-value">50%</span>
      </div>
      <div class="pp-slider-row detection-allocation-row" id="detection-allocation-row">
        <span class="pp-slider-mini-label">Allocation</span>
        <div class="pp-mode-seg detection-allocation-seg" role="radiogroup" aria-label="Detection label allocation">
          <button class="pp-mode-btn active" id="detection-allocation-elastic" data-allocation="ELASTIC" role="radio" aria-checked="true">Elastic</button>
          <button class="pp-mode-btn" id="detection-allocation-weighted" data-allocation="WEIGHTED" role="radio" aria-checked="false">Weighted</button>
        </div>
      </div>
      <div class="pp-slider-row detection-fade-row" id="detection-fade-row">
        <label class="pp-slider-mini-label" for="detection-fade-slider">Fade</label>
        <input type="range" class="pp-slider" id="detection-fade-slider" min="0" max="40" step="1" value="7" aria-label="Detection fade distance" title="World-overlay fade distance outside the keyhole as a percentage of its radius" />
        <span class="pp-slider-value" id="detection-fade-value">7%</span>
      </div>
      <div class="pp-slider-row detection-opacity-row" id="detection-opacity-row">
        <label class="pp-slider-mini-label" for="detection-opacity-slider">Outside</label>
        <input type="range" class="pp-slider" id="detection-opacity-slider" min="0" max="100" step="1" value="1" aria-label="Detection opacity outside the keyhole" title="World-overlay label and card opacity beyond the fade distance" />
        <span class="pp-slider-value" id="detection-opacity-value">1%</span>
      </div>
    </div>
    <!-- The one shared preset-parameter surface is inserted here at runtime. -->
    <div id="param-slider-panel">
      <div class="param-panel-header">
        <span class="param-panel-title">PARAMETERS</span>
        <span class="param-panel-divider"></span>
        <button class="panel-collapse-btn" id="param-panel-collapse-btn" data-collapse-target="param-slider-panel" title="Collapse panel">−</button>
      </div>
      <div id="param-sliders"></div>
    </div>
    <div class="pp-toggle-group">
      <!-- 3D aircraft is DEFAULT-ON in Proximity (owner directive 2026-08-22), so the
           button ships lit and the mode row ships open — the same markup-carries-the-default
           convention as #scope-toggle. ui.js re-syncs both from durable layer state, which
           is what flips them back for a share link or a stored session carrying 3D off. -->
      <button class="pp-toggle-btn active" id="models3d-toggle" aria-pressed="true" title="3D aircraft — flat icons zoomed out, 3D models up close">
        <span class="pp-icon">&#x2708;</span>
        <span class="pp-label">3D</span>
      </button>
      <div class="pp-slider-row visible" id="models3d-mode-row">
        <span class="pp-slider-mini-label">Models</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="3D model coverage">
          <button class="pp-mode-btn active" id="models3d-mode-proximity" data-mode="proximity" role="radio" aria-checked="true">Proximity</button>
          <button class="pp-mode-btn" id="models3d-mode-all" data-mode="all" role="radio" aria-checked="false">All</button>
        </div>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn active" id="scope-toggle" title="Scope — the circular viewport mask" aria-pressed="true">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">adjust</span>
        <span class="pp-label">Scope</span>
      </button>
      <div class="pp-slider-row visible" id="scope-slider-row">
        <span class="pp-slider-mini-label">Feather</span>
        <!-- Feather starts at an 11% soft scope-mask edge (owner final lock
             2026-08-24, superseding the 08-22 hard-crop and 08-23 8% rulings);
             mirrors SCOPE_FEATHER_RATIO_DEFAULT in src/scopeMask.js. Feather
             softens the black mask edge; label fading is the separate Fade
             slider. -->
        <input type="range" class="pp-slider" id="scope-feather-slider" min="0" max="100" value="11" aria-label="Scope edge feather" title="Scope edge feather as a percentage of the keyhole radius" />
        <span class="pp-slider-value" id="scope-feather-value">11%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="draw-toggle" title="Draw on the world — click vertices, double-click or Enter to finish, Esc to cancel" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">draw</span>
        <span class="pp-label">Draw</span>
      </button>
      <div class="pp-slider-row" id="draw-mode-row">
        <span class="pp-slider-mini-label">Shape</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="Shape to draw">
          <button class="pp-mode-btn active" data-shape="area" role="radio" aria-checked="true">Area</button>
          <button class="pp-mode-btn" data-shape="line" role="radio" aria-checked="false">Line</button>
          <button class="pp-mode-btn" data-shape="pin" role="radio" aria-checked="false">Pin</button>
        </div>
      </div>
      <div class="pp-slider-row" id="draw-label-row">
        <input type="text" class="pp-text-input" id="draw-label-input" maxlength="120" placeholder="Label (optional)" aria-label="Label for the drawn shape" autocomplete="off" spellcheck="false">
        <select class="pp-select draw-color-select" id="draw-color-select" aria-label="Colour of the drawn shape">
          <option value="primary">Primary</option>
          <option value="amber">Amber</option>
          <option value="cyan">Cyan</option>
          <option value="green">Green</option>
          <option value="red">Red</option>
        </select>
        <button class="pp-mode-btn draw-clear-btn" id="draw-clear" type="button" title="Remove every mark from the board">Clear</button>
        <span class="draw-hint" id="draw-hint" aria-live="polite"></span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="celestial-toggle" title="Celestial ring — reveal the full globe" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">flare</span>
        <span class="pp-label">Celestial</span>
      </button>
    </div>
    <div class="pp-toggle-group" id="osm-style-group">
      <div class="pp-slider-row visible osm-style-row">
        <span class="pp-slider-mini-label" id="osm-style-label">OSM Map Style</span>
        <div class="osm-style-swatches" role="radiogroup" aria-labelledby="osm-style-label">
          <button class="osm-style-btn active" data-osm-style="default" role="radio" aria-checked="true" title="Default raster OSM tiles">
            <span class="osm-style-dot" aria-hidden="true"></span><span class="osm-style-name">Default</span>
          </button>
          <button class="osm-style-btn" data-osm-style="positron" role="radio" aria-checked="false" title="Positron — light OpenMapTiles style">
            <span class="osm-style-dot" aria-hidden="true"></span><span class="osm-style-name">Positron</span>
          </button>
          <button class="osm-style-btn" data-osm-style="dark" role="radio" aria-checked="false" title="Dark — dark OpenMapTiles style">
            <span class="osm-style-dot" aria-hidden="true"></span><span class="osm-style-name">Dark</span>
          </button>
          <button class="osm-style-btn" data-osm-style="fiord" role="radio" aria-checked="false" title="Fiord — slate OpenMapTiles style">
            <span class="osm-style-dot" aria-hidden="true"></span><span class="osm-style-name">Fiord</span>
          </button>
          <button class="osm-style-btn" data-osm-style="mono" role="radio" aria-checked="false" title="Mono — monochrome map in the picked colour">
            <span class="osm-style-dot" aria-hidden="true"></span><span class="osm-style-name">Mono</span>
          </button>
          <label class="osm-mono-picker" title="Pick the Mono map colour">
            <span class="osm-style-name">Colour</span>
            <input type="color" class="pp-color-input" id="osm-mono-color" value="#3cff7a" aria-label="Mono map colour" />
          </label>
        </div>
      </div>
      <div class="pp-slider-row visible osm-variant-row">
        <label class="pp-slider-mini-label" for="osm-style-variant">Variant</label>
        <select id="osm-style-variant" class="pp-select" aria-label="OSM map style variant" disabled title="Pick a vector style (not Default) to use a variant">
          <option value="normal">None</option>
          <option value="outline">Outline</option>
          <option value="outline-light">Outline light</option>
          <option value="outline-inverted">Outline inverted</option>
          <option value="outline-light-inverted">Outline light inverted</option>
        </select>
      </div>
    </div>
    <button class="pp-toggle-btn" id="clean-view-toggle" title="Hide UI chrome">
      <span class="pp-icon">&#x25A1;</span>
      <span class="pp-label">Clean UI</span>
    </button>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="bloom-toggle" title="Bloom / Glow">
        <span class="pp-icon">&#x2728;</span>
        <span class="pp-label">Bloom</span>
      </button>
      <div class="pp-slider-row" id="bloom-slider-row">
        <input type="range" class="pp-slider" id="bloom-intensity-slider" min="0" max="200" value="0" aria-label="Bloom intensity" />
        <span class="pp-slider-value" id="bloom-intensity-value">0%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="sharpen-toggle" title="Sharpening">
        <span class="pp-icon">&#x1F50D;</span>
        <span class="pp-label">Sharpen</span>
      </button>
      <div class="pp-slider-row" id="sharpen-slider-row">
        <input type="range" class="pp-slider" id="sharpen-intensity-slider" min="0" max="100" value="49" aria-label="Sharpen intensity" />
        <span class="pp-slider-value" id="sharpen-intensity-value">49%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="map-tint-toggle" title="Tint the map with a colour" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">palette</span>
        <span class="pp-label">Tint</span>
      </button>
      <div class="pp-slider-row visible map-tint-color-row">
        <label class="pp-slider-mini-label" for="map-tint-color">Colour</label>
        <input type="color" class="pp-color-input" id="map-tint-color" value="#4a90d9" aria-label="Map tint colour" />
      </div>
      <div class="pp-slider-row" id="map-tint-slider-row">
        <label class="pp-slider-mini-label" for="map-tint-strength-slider">Strength</label>
        <input type="range" class="pp-slider" id="map-tint-strength-slider" min="0" max="100" value="50" aria-label="Map tint strength" />
        <span class="pp-slider-value" id="map-tint-strength-value">50%</span>
      </div>
    </div>
  </div>
  </div>
  <button id="clean-view-exit" title="Return UI controls">EXIT CLEAN VIEW</button>
