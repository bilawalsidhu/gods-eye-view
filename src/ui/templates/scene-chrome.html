  <div id="cesiumContainer"></div>

    </button>
    <button id="north-up-view" type="button" aria-label="Reset map to north up" title="Reset map bearing to north">

      <span class="camera-compass-needle material-symbols-outlined" aria-hidden="true">navigation</span>
    </button>
    <button id="reset-globe-view" type="button" aria-label="Reset to full globe view" title="Reset camera and return to full globe view">

    </button>
  </nav>
  <div id="global-loading-status" role="status" aria-live="polite" aria-atomic="true" hidden>

    <span id="global-loading-detail"></span>
  </div>
  <div id="traffic-sync-chip" aria-live="polite">

    <span id="traffic-sync-progress">0%</span>
  </div>
  <div id="cctv-sync-chip" aria-live="polite">

      type="button"

      aria-controls="data-panel"
      aria-pressed="false"
    >
      <span class="mobile-nav-icon material-symbols-outlined" aria-hidden="true"
        >layers</span
      >
      <span class="mobile-nav-label">Layers</span>
    </button>
    <button
      class="mobile-nav-btn"
      type="button"
      data-mobile-panel="scenes"
      aria-controls="scene-panel"
      aria-pressed="false"
    >
      <span class="mobile-nav-icon material-symbols-outlined" aria-hidden="true"
        >movie</span
      >
      <span class="mobile-nav-label">Scenes</span>
    </button>
    <button
      class="mobile-nav-btn"
      type="button"
      data-mobile-panel="controls"

    >
      <span class="mobile-nav-icon material-symbols-outlined" aria-hidden="true"
        >adjust</span
      >
      <span class="mobile-nav-label">Controls</span>
    </button>
    <button
      class="mobile-nav-btn"
      type="button"
      data-mobile-panel="context"
      aria-controls="global-context-panel"
      aria-pressed="false"
    >
      <span class="mobile-nav-icon material-symbols-outlined" aria-hidden="true"
        >radar</span
      >
      <span class="mobile-nav-label">Context</span>
    </button>
  </nav>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  </div>
