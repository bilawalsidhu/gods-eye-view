  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="Navigation, voice, and visual preset controls"  data-i18n-aria-label="shell.dock.ariaLabel">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="Expand Visual Presets"  data-i18n-aria-label="cockpit.presets.toggleAriaLabel">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>VISUAL PRESETS</span>
        <span class="panel-divider"></span>
      </button>
      <!-- Language selector: only the group container is static (its
           data-i18n-aria-label is applied from the catalog at boot). The
           buttons are rendered at runtime by ui.js _initLocaleSelector(): one
           per locale in the configured GEV_DEFAULT_LOCALE / GEV_SECONDARY_LOCALE
           pair plus the always-shipped English fallback, deduped, labels EN/ES/FR
           with aria-labels from shell.locale.<code>.ariaLabel. -->
      <div class="dock-locale-switch" role="group"  data-i18n-aria-label="shell.locale.groupAriaLabel"></div>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="Pin visual presets" aria-pressed="false" title="Keep visual presets open"  data-i18n-aria-label="cockpit.presets.pinAriaLabel"  data-i18n-title="cockpit.presets.pinTitle"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="Show the globe without a visual filter."  data-i18n-title="cockpit.presets.styleNormalTitle">
          <span class="btn-icon">◯</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleNormalLabel">Normal</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="Emulate a green phosphor CRT with scanlines and screen curvature."  data-i18n-title="cockpit.presets.styleCrtTitle">
          <span class="btn-icon">▦</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleCrtLabel">CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="Simulate night-vision goggles with green intensification and a tube vignette."  data-i18n-title="cockpit.presets.styleNvgTitle">
          <span class="btn-icon">🌙</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleNvgLabel">NVG</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="Simulate FLIR-style thermal contrast. Turn up Ironbow for color."  data-i18n-title="cockpit.presets.styleFlirTitle">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleFlirLabel">FLIR</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="Apply bright cel-shaded color and illustrated outlines."  data-i18n-title="cockpit.presets.styleAnimeTitle">
          <span class="btn-icon">✦</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleAnimeLabel">Anime</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="Apply high-contrast monochrome film-noir grading."  data-i18n-title="cockpit.presets.styleNoirTitle">
          <span class="btn-icon">◐</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleNoirLabel">Noir</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="Add a cold, snowy whiteout treatment to the scene."  data-i18n-title="cockpit.presets.styleSnowTitle">
          <span class="btn-icon">❄</span>
          <span class="btn-label"  data-i18n="cockpit.presets.styleSnowLabel">Snow</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">MAP SOURCE</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">3D</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="Map source"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label"  data-i18n="cockpit.presets.miniStyleLabel">Style</span>
        <span id="style-mini-value" class="panel-mini-value">NORMAL</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Expand LOCATION" title="Expand LOCATION"  data-i18n-aria-label="cockpit.location.toggleAria"  data-i18n-title="cockpit.location.toggleAria">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>LOCATION</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="Collapse panel"  data-i18n-title="cockpit.location.collapseTitle">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city"  data-i18n="cockpit.location.miniCityInitial">📍 Location: --</div>
        <div id="location-mini-poi" class="location-mini-poi"  data-i18n="cockpit.location.miniPoiInitial">Landmark: --</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="Pin location tray" aria-pressed="false" title="Keep location tray open"  data-i18n-aria-label="cockpit.location.pinAriaLabel"  data-i18n-title="cockpit.location.pinTitle"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="Search any location"  data-i18n-title="cockpit.location.searchToggleTitle">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="Search any location..." autocomplete="off" spellcheck="false" aria-label="Search location by name or coordinates"  data-i18n-aria-label="cockpit.location.searchAria"  data-i18n-placeholder="cockpit.location.searchPlaceholder" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
