<!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
<div
  id="command-dock"
  aria-label="Navigation, voice, and visual preset controls"
>
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button
        id="control-panel-toggle"
        class="panel-header dock-tray-toggle"
        type="button"
        data-dock-toggle-target="control-panel"
        aria-expanded="false"
        aria-controls="control-panel-popover"
        aria-label="Expand Visual Presets"
      >
        <span class="panel-title"
          ><span
            class="dock-label-icon dock-label-icon-presets"
            aria-hidden="true"
          ></span
          >VISUAL PRESETS</span
        >
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
        <button
          class="dock-pin-btn"
          data-pin-target="control-panel"
          type="button"
          aria-label="Pin visual presets"
          aria-pressed="false"
          title="Keep visual presets open"
        >
          <img src="/pin.svg" alt="" />
        </button>
        <div id="style-buttons" class="button-grid">
          <button
            class="style-btn active"
            data-style="normal"
            title="Show the globe without a visual filter."
          >
            <span class="btn-icon">◯</span>
            <span class="btn-label">Normal</span>
            <span class="btn-key">1</span>
          </button>
          <button
            class="style-btn"
            data-style="retro"
            title="Emulate a green phosphor CRT with scanlines and screen curvature."
          >
            <span class="btn-icon">▦</span>
            <span class="btn-label">CRT</span>
            <span class="btn-key">2</span>
          </button>
          <button
            class="style-btn"
            data-style="surveillance"
            title="Simulate night-vision goggles with green intensification and a tube vignette."
          >
            <span class="btn-icon">🌙</span>
            <span class="btn-label">NVG</span>
            <span class="btn-key">3</span>
          </button>
          <button
            class="style-btn"
            data-style="thermal"
            title="Simulate FLIR-style thermal contrast. Turn up Ironbow for color."
          >
            <span class="btn-icon">🌡️</span>
            <span class="btn-label">FLIR</span>
            <span class="btn-key">4</span>
          </button>
          <button
            class="style-btn"
            data-style="anime"
            title="Apply bright cel-shaded color and illustrated outlines."
          >
            <span class="btn-icon">✦</span>
            <span class="btn-label">Anime</span>
            <span class="btn-key">5</span>
          </button>
          <button
            class="style-btn"
            data-style="noir"
            title="Apply high-contrast monochrome film-noir grading."
          >
            <span class="btn-icon">◐</span>
            <span class="btn-label">Noir</span>
            <span class="btn-key">6</span>
          </button>
          <button
            class="style-btn"
            data-style="snow"
            title="Add a cold, snowy whiteout treatment to the scene."
          >
            <span class="btn-icon">❄</span>
            <span class="btn-label">Snow</span>
            <span class="btn-key">7</span>
          </button>
        </div>
        <section class="map-source-section" aria-labelledby="map-source-label">
          <div class="map-source-heading">
            <span id="map-source-label">MAP SOURCE</span>
            <span
              id="map-stack-status"
              class="pp-stack-status"
              aria-live="polite"
              >3D</span
            >
          </div>
          <div
            id="map-stack-chips"
            class="map-stack-chip-row"
            role="group"
            aria-label="Map source"
          ></div>
        </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label">Style</span>
        <span id="style-mini-value" class="panel-mini-value">NORMAL</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button
          id="location-bar-toggle"
          class="dock-tray-toggle"
          type="button"
          data-dock-toggle-target="location-bar"
          aria-controls="location-bar-popover"
          aria-expanded="false"
          aria-label="Expand LOCATION"
          title="Expand LOCATION"
        >
          <span class="location-toolbar-label"
            ><span
              class="dock-label-icon dock-label-icon-location"
              aria-hidden="true"
            ></span
            >LOCATION</span
          >
        </button>
        <button
          class="panel-collapse-btn"
          data-collapse-target="location-bar"
          title="Collapse panel"
        >
          +
        </button>
      </div>
      <div
        id="location-mini-status"
        class="location-mini-status"
        aria-live="polite"
      >
        <div id="location-mini-city" class="location-mini-city">
          📍 Location: --
        </div>
        <div id="location-mini-poi" class="location-mini-poi">Landmark: --</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button
          class="dock-pin-btn"
          data-pin-target="location-bar"
          type="button"
          aria-label="Pin location tray"
          aria-pressed="false"
          title="Keep location tray open"
        >
          <img src="/pin.svg" alt="" />
        </button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button
              id="search-toggle"
              class="search-toggle-btn"
              title="Search any location"
            >
              <span>&#x1F50E;</span>
            </button>
            <input
              type="text"
              id="location-search"
              placeholder="Search any location..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search location by name or coordinates"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
